="11" text-anchor="middle" font-weight="400">4</text><line class="grid" x1="548.4" y1="64" x2="548.4" y2="316" stroke-width="1"/><text x="548.4" y="332.0" class="tm num" font-size="11" text-anchor="middle" font-weight="400">6</text><line class="grid" x1="619.2" y1="64" x2="619.2" y2="316" stroke-width="1"/><text x="619.2" y="332.0" class="tm num" font-size="11" text-anchor="middle" font-weight="400">8</text><line class="grid" x1="690.0" y1="64" x2="690.0" y2="316" stroke-width="1"/><text x="690.0" y="332.0" class="tm num" font-size="11" text-anchor="middle" font-weight="400">10</text><text x="690.0" y="346.0" class="tm" font-size="11" text-anchor="end" font-weight="400">tokens / s</text><text x="16.0" y="360.0" class="tm" font-size="10" text-anchor="start" font-weight="400">Measured on Xiaomi 25010PN30G: Snapdragon 8 Elite (SM8750), 15 GB RAM, UFS 4, Adreno 830.</text><text x="326.0" y="81.0" class="t1" font-size="12" text-anchor="end" font-weight="400">Before (condition-variable thread pool)</text><path class="f0" d="M336.0,70.0 H440.3 Q444.3,70.0 444.3,74.0 V80.0 Q444.3,84.0 440.3,84.0 H336.0 Z"/><text x="450.3" y="81.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">3.1</text><text x="326.0" y="111.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ spinning thread pool</text><path class="f0" d="M336.0,100.0 H446.7 Q450.7,100.0 450.7,104.0 V110.0 Q450.7,114.0 446.7,114.0 H336.0 Z"/><text x="456.7" y="111.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">3.2</text><text x="326.0" y="141.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ fresh expert loads kept in the cache</text><path class="f0" d="M336.0,130.0 H528.1 Q532.1,130.0 532.1,134.0 V140.0 Q532.1,144.0 528.1,144.0 H336.0 Z"/><text x="538.1" y="141.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">5.5</text><text x="326.0" y="171.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ a block&#x27;s experts in one batched pass</text><path class="f0" d="M336.0,160.0 H541.9 Q545.9,160.0 545.9,164.0 V170.0 Q545.9,174.0 541.9,174.0 H336.0 Z"/><text x="551.9" y="171.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">5.9</text><text x="326.0" y="201.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ K-quant x Q8_K kernels (A/B reference)</text><path class="f0" d="M336.0,190.0 H549.7 Q553.7,190.0 553.7,194.0 V200.0 Q553.7,204.0 549.7,204.0 H336.0 Z"/><text x="559.7" y="201.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">6.2</text><text x="326.0" y="231.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ next block predicted after the mixer</text><path class="f0" d="M336.0,220.0 H560.0 Q564.0,220.0 564.0,224.0 V230.0 Q564.0,234.0 560.0,234.0 H336.0 Z"/><text x="570.0" y="231.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">6.4</text><text x="326.0" y="261.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ 7 threads, chunks claimed on demand</text><path class="f0" d="M336.0,250.0 H609.2 Q613.2,250.0 613.2,254.0 V260.0 Q613.2,264.0 609.2,264.0 H336.0 Z"/><text x="619.2" y="261.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">7.8</text><text x="326.0" y="291.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ an expert&#x27;s three matrices read in parallel</text><path class="f0" d="M336.0,280.0 H646.7 Q650.7,280.0 650.7,284.0 V290.0 Q650.7,294.0 646.7,294.0 H336.0 Z"/><text x="656.7" y="291.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">8.9</text><line class="axis" x1="336" y1="64" x2="336" y2="316" stroke-width="1"/></svg>
