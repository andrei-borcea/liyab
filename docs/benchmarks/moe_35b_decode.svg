="11" text-anchor="middle" font-weight="400">3</text><line class="grid" x1="534.8" y1="64" x2="534.8" y2="256" stroke-width="1"/><text x="534.8" y="272.0" class="tm num" font-size="11" text-anchor="middle" font-weight="400">5</text><line class="grid" x1="612.4" y1="64" x2="612.4" y2="256" stroke-width="1"/><text x="612.4" y="272.0" class="tm num" font-size="11" text-anchor="middle" font-weight="400">6</text><line class="grid" x1="690.0" y1="64" x2="690.0" y2="256" stroke-width="1"/><text x="690.0" y="272.0" class="tm num" font-size="11" text-anchor="middle" font-weight="400">8</text><text x="690.0" y="286.0" class="tm" font-size="11" text-anchor="end" font-weight="400">tokens / s</text><text x="16.0" y="300.0" class="tm" font-size="10" text-anchor="start" font-weight="400">Measured on Xiaomi 25010PN30G: Snapdragon 8 Elite (SM8750), 15 GB RAM, UFS 4, Adreno 830.</text><text x="292.0" y="81.0" class="t1" font-size="12" text-anchor="end" font-weight="400">Before (condition-variable thread pool)</text><path class="f0" d="M302.0,70.0 H446.4 Q450.4,70.0 450.4,74.0 V80.0 Q450.4,84.0 446.4,84.0 H302.0 Z"/><text x="456.4" y="81.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">3.1</text><text x="292.0" y="111.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ spinning thread pool</text><path class="f0" d="M302.0,100.0 H455.1 Q459.1,100.0 459.1,104.0 V110.0 Q459.1,114.0 455.1,114.0 H302.0 Z"/><text x="465.1" y="111.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">3.2</text><text x="292.0" y="141.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ fresh expert loads kept in the cache</text><path class="f0" d="M302.0,130.0 H566.7 Q570.7,130.0 570.7,134.0 V140.0 Q570.7,144.0 566.7,144.0 H302.0 Z"/><text x="576.7" y="141.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">5.5</text><text x="292.0" y="171.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ a block&#x27;s experts in one batched pass</text><path class="f0" d="M302.0,160.0 H585.6 Q589.6,160.0 589.6,164.0 V170.0 Q589.6,174.0 585.6,174.0 H302.0 Z"/><text x="595.6" y="171.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">5.9</text><text x="292.0" y="201.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ K-quant x Q8_K kernels (A/B reference)</text><path class="f0" d="M302.0,190.0 H596.3 Q600.3,190.0 600.3,194.0 V200.0 Q600.3,204.0 596.3,204.0 H302.0 Z"/><text x="606.3" y="201.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">6.2</text><text x="292.0" y="231.0" class="t1" font-size="12" text-anchor="end" font-weight="400">+ next block predicted after the mixer</text><path class="f0" d="M302.0,220.0 H610.3 Q614.3,220.0 614.3,224.0 V230.0 Q614.3,234.0 610.3,234.0 H302.0 Z"/><text x="620.3" y="231.0" class="t1 num" font-size="11" text-anchor="start" font-weight="400">6.4</text><line class="axis" x1="302" y1="64" x2="302" y2="256" stroke-width="1"/></svg>
